<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
</head>

<body>

    <h1>Diabetes Prediction</h1>

    <form action="/predict" method="POST">

        <label>Age:</label>
        <input type="number" name="Age" required>
        <br><br>

        <label>Gender:</label>
        <select name="Gender">
            <option>Male</option>
            <option>Female</option>
        </select>
        <br><br>

        <label>Polyuria:</label>
        <select name="Polyuria">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Polydipsia:</label>
        <select name="Polydipsia">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Sudden Weight Loss:</label>
        <select name="sudden weight loss">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Weakness:</label>
        <select name="weakness">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Polyphagia:</label>
        <select name="Polyphagia">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Genital Thrush:</label>
        <select name="Genital thrush">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Visual Blurring:</label>
        <select name="visual blurring">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Itching:</label>
        <select name="Itching">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Irritability:</label>
        <select name="Irritability">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Delayed Healing:</label>
        <select name="delayed healing">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Partial Paresis:</label>
        <select name="partial paresis">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Muscle Stiffness:</label>
        <select name="muscle stiffness">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Alopecia:</label>
        <select name="Alopecia">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <label>Obesity:</label>
        <select name="Obesity">
            <option>Yes</option>
            <option>No</option>
        </select>
        <br><br>

        <button type="submit">Predict</button>

    </form>

    {% if prediction %}
        <h2>Result: {{ prediction }}</h2>
        <p>Probability: {{ probability }}%</p>
        <p>{{ message }}</p>
    {% endif %}

</body>
</html>
